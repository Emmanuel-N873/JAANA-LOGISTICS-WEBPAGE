<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JAANA — Staff orders</title><link rel="stylesheet" href="design-system.css"><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head>
<body><main class="staff-shell"><a href="index.html">← JAANA homepage</a><h1>Delivery orders</h1><p>Authorised JAANA staff only. Review saved requests and keep delivery statuses up to date.</p>
<form id="staff-login"><label for="staff-token">Staff access token</label><input id="staff-token" type="password" required autocomplete="off" minlength="32" maxlength="256"><button class="button button-blue" type="submit">Open orders</button></form>
<p id="staff-message" role="status" aria-live="polite"></p><section id="staff-orders" hidden><div class="staff-toolbar"><button class="button button-blue" id="refresh" type="button">Refresh</button><button class="button" id="logout" type="button">Sign out</button></div><div id="order-list"></div><div class="staff-toolbar"><button class="button" id="previous" type="button">Previous page</button><span id="page-label"></span><button class="button" id="next" type="button">Next page</button></div></section></main></body></html>
